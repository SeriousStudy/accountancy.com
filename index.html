
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Accountancy Protocol 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --elite-blue: #0071e3;
            --elite-dark-surface: #0a0a0a;
            --elite-light-surface: #fbfbfd;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: var(--elite-light-surface);
            transition: background-color 0.8s ease;
        }
        .dark body { background-color: #000; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .apple-card {
            border-radius: 2rem;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid rgba(0,0,0,0.05);
            background: white;
        }
        .dark .apple-card {
            background: #0d0d0d;
            border-color: rgba(255,255,255,0.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .apple-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 80px rgba(0,113,227,0.15);
            border-color: var(--elite-blue);
        }

        /* Specialized Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(0,113,227,0.2); }
            50% { box-shadow: 0 0 25px rgba(0,113,227,0.5); }
        }
        .glow-active { animation: glowPulse 2s infinite; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
